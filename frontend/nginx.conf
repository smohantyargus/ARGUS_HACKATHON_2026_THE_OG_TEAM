server {
    listen 5173;
    client_max_body_size 100M;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to orchestrator
    location /api/ {
        proxy_pass http://orchestrator:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoint — disable nginx buffering so events reach the client immediately
    location /api/v1/jobs/ {
        proxy_pass http://orchestrator:8000/v1/jobs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-specific: disable buffering, keep connection alive
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 620s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # Proxy config-api calls to config-service
    location /config-api/ {
        proxy_pass http://config-service:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Role $http_x_user_role;
    }

    # SPA fallback — all other routes served by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
