[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civis-obs"
version = "0.1.0"
description = "Shared observability (logging + metrics) for civis agents."
requires-python = ">=3.10"
dependencies = [
    "prometheus-client>=0.20.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "aiokafka>=0.9.0",
    "redis>=4.0.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "tiktoken>=0.7",
]

[tool.setuptools.packages.find]
include = ["civis_obs*"]
